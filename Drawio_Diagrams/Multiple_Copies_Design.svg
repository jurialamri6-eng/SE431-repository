<svg xmlns="http://www.w3.org/2000/svg" style="background: #ffffff;" version="1.1" width="1076px" height="391px" viewBox="0 0 1076 391"><defs /><rect fill="#ffffff" width="100%" height="100%" x="0" y="0" /><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="title"><g><rect x="15" y="14" width="1046" height="50" fill="none" stroke="none" pointer-events="all" /></g><g><g><text x="15" y="50" fill="#163047" font-family="Arial" font-size="35px" font-weight="bold">MR-01: Multiple Copies</text></g></g></g><g data-cell-id="start"><g><rect x="15" y="135" width="251" height="154" rx="15.4" ry="15.4" fill="#e7f3f7" stroke="#456175" stroke-width="2" pointer-events="all" /></g><g data-cell-id="start-title"><g><rect x="23" y="142" width="235" height="38" fill="none" stroke="none" pointer-events="all" /></g><g><g><text x="141" y="169" fill="#163047" font-family="Arial" font-size="28px" text-anchor="middle" font-weight="bold">Start</text></g></g></g><g data-cell-id="start-detail"><g><rect x="23" y="180" width="235" height="104" fill="none" stroke="none" pointer-events="all" /></g><g><g><text x="141" y="239" fill="#163047" font-family="Arial" font-size="23px" text-anchor="middle">2 / 2 available</text></g></g></g></g><g data-cell-id="borrow"><g><rect x="280" y="135" width="251" height="154" rx="15.4" ry="15.4" fill="#f4f7fa" stroke="#456175" stroke-width="2" pointer-events="all" /></g><g data-cell-id="borrow-title"><g><rect x="288" y="142" width="235" height="38" fill="none" stroke="none" pointer-events="all" /></g><g><g><text x="406" y="169" fill="#163047" font-family="Arial" font-size="28px" text-anchor="middle" font-weight="bold">Borrow twice</text></g></g></g><g data-cell-id="borrow-detail"><g><rect x="288" y="180" width="235" height="104" fill="none" stroke="none" pointer-events="all" /></g><g><g><text x="406" y="239" fill="#163047" font-family="Arial" font-size="23px" text-anchor="middle">0 / 2 available</text></g></g></g></g><g data-cell-id="reject"><g><rect x="545" y="135" width="251" height="154" rx="15.4" ry="15.4" fill="#fbf0e8" stroke="#456175" stroke-width="2" pointer-events="all" /></g><g data-cell-id="reject-title"><g><rect x="553" y="142" width="235" height="38" fill="none" stroke="none" pointer-events="all" /></g><g><g><text x="671" y="169" fill="#163047" font-family="Arial" font-size="28px" text-anchor="middle" font-weight="bold">Third request</text></g></g></g><g data-cell-id="reject-detail"><g><rect x="553" y="180" width="235" height="104" fill="none" stroke="none" pointer-events="all" /></g><g><g><text x="671" y="225" fill="#163047" font-family="Arial" font-size="23px" text-anchor="middle"><tspan x="671" y="225">Rejected</tspan><tspan x="671" y="253">0 / 2 available</tspan></text></g></g></g></g><g data-cell-id="return"><g><rect x="810" y="135" width="251" height="154" rx="15.4" ry="15.4" fill="#eaf4ed" stroke="#456175" stroke-width="2" pointer-events="all" /></g><g data-cell-id="return-title"><g><rect x="818" y="142" width="235" height="38" fill="none" stroke="none" pointer-events="all" /></g><g><g><text x="936" y="169" fill="#163047" font-family="Arial" font-size="28px" text-anchor="middle" font-weight="bold">Return loan 1</text></g></g></g><g data-cell-id="return-detail"><g><rect x="818" y="180" width="235" height="104" fill="none" stroke="none" pointer-events="all" /></g><g><g><text x="936" y="239" fill="#163047" font-family="Arial" font-size="23px" text-anchor="middle">1 / 2 available</text></g></g></g></g><g data-cell-id="edge-start-borrow"><g transform="translate(0.5,0.5)"><path d="M 266 212 L 263.7 212" fill="none" stroke="#14577b" stroke-width="2.5" stroke-miterlimit="10" pointer-events="stroke" /><path d="M 277.2 212 L 263.7 218.75 L 263.7 205.25 Z" fill="#14577b" stroke="#14577b" stroke-width="2.5" stroke-miterlimit="10" pointer-events="all" /></g></g><g data-cell-id="edge-borrow-reject"><g transform="translate(0.5,0.5)"><path d="M 531 212 L 528.7 212" fill="none" stroke="#14577b" stroke-width="2.5" stroke-miterlimit="10" pointer-events="stroke" /><path d="M 542.2 212 L 528.7 218.75 L 528.7 205.25 Z" fill="#14577b" stroke="#14577b" stroke-width="2.5" stroke-miterlimit="10" pointer-events="all" /></g></g><g data-cell-id="edge-reject-return"><g transform="translate(0.5,0.5)"><path d="M 796 212 L 793.7 212" fill="none" stroke="#14577b" stroke-width="2.5" stroke-miterlimit="10" pointer-events="stroke" /><path d="M 807.2 212 L 793.7 218.75 L 793.7 205.25 Z" fill="#14577b" stroke="#14577b" stroke-width="2.5" stroke-miterlimit="10" pointer-events="all" /></g></g><g data-cell-id="invariant"><g><rect x="15" y="329" width="1046" height="48" fill="none" stroke="none" pointer-events="all" /></g><g><g><text x="538" y="360" fill="#163047" font-family="Arial" font-size="24px" text-anchor="middle" font-weight="bold">A successful borrow or return updates the loan and stock in one transaction.</text></g></g></g></g></g></g></svg>